<text x="60" y="953" font-size="17" font-weight="400" text-anchor="start" fill="#546676">共地：ESP32 GND、驱动信号GND、降压GND与电池负极参考相通；电机M−不是GND。</text>
<text x="60" y="981" font-size="17" font-weight="400" text-anchor="start" fill="#8B530B">电源箭头代表成对电源线。图为连接规划，非整机验收；B路须先核驱动3S满电兼容及线束载流。</text></g></svg>