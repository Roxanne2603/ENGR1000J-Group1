<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">System Flow Chart - ESP32 test system v2.5</title><desc id="desc">Three ToF sensors feed the ESP32. The ESP32 controls an AT8236 dual motor driver and steering servo. Left and right motor encoders return to the ESP32. A 3S battery feeds a parallel splitter: A goes to the regulator and fixed 5V servo supply; B is a pending motor-driver supply. The ESP32 uses computer USB power. Branch B stays disconnected pending voltage compatibility and current checks.</desc><defs><marker id="control-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2461A0"/></marker><marker id="feedback-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#21805D"/></marker><marker id="power-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#BE4A3B"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="60" y="54" font-size="36" font-weight="600" text-anchor="start" fill="#183247">System Flow Chart</text>
<text x="60" y="87" font-size="19" font-weight="400" text-anchor="start" fill="#546676">系统框图 · ESP32测试系统 · 并联一拖二供电 · v2.5</text>
